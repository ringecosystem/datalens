services:
  rustfs-perms:
    image: alpine:3.22
    user: root
    volumes:
      - ./.data/oss:/data
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-datalens-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-datalens-dev-secret}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-:9000}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.data/oss:/data
    command: /data

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-datalens-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-datalens-dev-secret}
      DATALENS_S3_BUCKET: ${DATALENS_S3_BUCKET:-datalens}
    entrypoint: /bin/sh
    command: >
      -c '
      until mc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY";
      do sleep 1;
      done;
      mc mb --ignore-existing "rustfs/$$DATALENS_S3_BUCKET"
      '

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATALENS_POSTGRES_TEST_USER:-datalens}
      POSTGRES_PASSWORD: ${DATALENS_POSTGRES_TEST_PASSWORD:-datalens}
      POSTGRES_DB: ${DATALENS_POSTGRES_TEST_DB:-datalens_test}
    ports:
      - "${DATALENS_POSTGRES_TEST_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 20

  datalens-server:
    profiles:
      - datalens
    build: .
    image: ${DATALENS_IMAGE:-datalens:local}
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-datalens-dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-datalens-dev-secret}
      AWS_REGION: ${AWS_REGION:-auto}
      DATALENS_S3_ENDPOINT_URL: ${DATALENS_S3_INTERNAL_ENDPOINT_URL:-http://rustfs:9000}
      DATALENS_S3_BUCKET: ${DATALENS_S3_BUCKET:-datalens}
      DATALENS_S3_PREFIX: ${DATALENS_S3_PREFIX:-local-compose}
      DATALENS_S3_REGION: ${DATALENS_S3_REGION:-auto}
      DATALENS_ETHEREUM_RPC_URL: ${DATALENS_ETHEREUM_RPC_URL:-http://host.docker.internal:8545}
      DATALENS_PUBLIC_APP_TOKEN: ${DATALENS_PUBLIC_APP_TOKEN:-replace-with-public-app-token}
      DATALENS_ORMP_TOKEN: ${DATALENS_ORMP_TOKEN:-replace-with-local-token}
      DATALENS_METRICS_TOKEN: ${DATALENS_METRICS_TOKEN:-replace-with-metrics-token}
      RUST_LOG: ${RUST_LOG:-datalens=info}
    ports:
      - "${DATALENS_SERVER_PORT:-3000}:3000"
    volumes:
      - ./config/datalens.compose.toml:/etc/datalens/datalens.toml:ro
    command:
      - serve
      - --config
      - ${DATALENS_SERVER_CONFIG:-/etc/datalens/datalens.toml}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
