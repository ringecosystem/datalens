[server]
bind = "127.0.0.1:3000"

[storage]
backend = "local"

[storage.local]
root = ".tmp/datalens-dev"

[planner]
max_query_range_blocks = 1000
default_chunk_range_blocks = 100

[writer]
target_object_bytes = 16777216
min_object_rows = 1000
record_empty_coverage = true

[writer.staging]
enabled = true
min_rows = 1000
target_object_bytes = 16777216
max_staged_ranges = 32
max_staged_rows = 10000
max_staged_age_ms = 60000
flush_on_shutdown = true
max_staged_bytes = 33554432

[metrics]
enabled = true
default_application = "local"

[query.native]
graphql_enabled = true
path = "/native/graphql"
playground_enabled = true
playground_path = "/native/graphiql"

[warmup]
enabled = false
registry_path = ".tmp/datalens-warmup"
scheduler_interval_ms = 1000
max_global_tasks = 1
max_per_chain_tasks = 1
max_fetches_per_loop = 1
flush_on_shutdown = true

[applications]
required = false

[chains.ethereum]
kind = "evm"
chain_id = 1
rpc_urls = ["${DATALENS_ETHEREUM_RPC_URL}"]

[chains.ethereum.finality]
mode = "lag"
safe_lag_blocks = 32
finalized_lag_blocks = 96

[chains.ethereum.datasets.blocks]
enabled = true
max_batch_blocks = 100

[chains.ethereum.datasets.logs]
enabled = true
max_get_logs_range_blocks = 1000
max_addresses_per_query = 16
