# Local development against `docker compose up postgres`. Tokens here are local-only.

[server]
bind = "127.0.0.1:3000"
roles = ["api", "worker"]

[database]
url = "postgres://datalens:datalens@127.0.0.1:5432/datalens"
max_connections = 8

[metrics]
bearer_token = "dev-metrics-token"

[chains.ethereum]
chain_id = 1
rpc_url = "${DATALENS_ETHEREUM_RPC_URL}"
finality = { mode = "lag", safe_lag_blocks = 32, finalized_lag_blocks = 96 }
chunk_blocks = 10000
max_get_logs_range_blocks = 10000
max_addresses_per_query = 32
provider = { rps = 5, burst = 10, max_in_flight = 2 }

[[applications]]
id = "dev"
token = "dev-token"
chains = ["ethereum"]
datasets = ["evm.logs", "evm.blocks"]
quota = { max_range_blocks = 100000, max_requests_per_minute = 600, max_concurrent_requests = 8, max_subscriptions = 20 }
