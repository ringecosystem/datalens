# Production-shaped datalens configuration. Every secret and endpoint is an env placeholder.

[server]
bind = "0.0.0.0:3000"
roles = ["api", "worker"]

[database]
url = "${DATALENS_DATABASE_URL}"
max_connections = 32

[query]
max_wait_ms = 15000
page_limit = 10000
follow_attach_blocks = 1000

[follow]
subscription_ttl_s = 900
unsafe_retention_s = 86400

[fill]
workers = 4
inline_workers = 2
lease_s = 120

[metrics]
bearer_token = "${DATALENS_METRICS_TOKEN}"

[chains.ethereum]
chain_id = 1
rpc_url = "${DATALENS_ETHEREUM_RPC_URL}"
finality = { mode = "lag", safe_lag_blocks = 32, finalized_lag_blocks = 96 }
chunk_blocks = 10000
max_get_logs_range_blocks = 10000
max_addresses_per_query = 32
provider = { rps = 10, burst = 20, daily_calls = 1000000, max_in_flight = 4 }

[chains.darwinia]
chain_id = 46
rpc_url = "${DATALENS_DARWINIA_RPC_URL}"
finality = { mode = "lag", safe_lag_blocks = 64, finalized_lag_blocks = 256 }
