[index.application.output]
kind = "database"

[index.application.output.database]
driver = "postgres"
url = "${DATALENS_INDEX_DATABASE_URL}"

[index.application.query]
enabled = false
protocol = "graphql"
bind = "127.0.0.1:3000"
path = "/index/graphql"
playground = false

[index.application.query.metrics]
enabled = false
path = "/index/metrics"
token_env = "DATALENS_INDEX_QUERY_METRICS_TOKEN"

[index.application.checkpoint]
path = "indexes/ormp/checkpoint.json"

[warmup]
enabled = false
registry_path = "indexes/warmup"
scheduler_interval_ms = 1000
max_global_tasks = 1
max_per_chain_tasks = 1
max_fetches_per_loop = 1
flush_on_shutdown = true

[applications]
required = true

[[applications.applications]]
id = "ormp"
name = "ormp"
enabled = true
display_name = "ORMP Local Example"
token = "${DATALENS_ORMP_TOKEN}"
chains = ["ethereum"]
datasets = ["evm.blocks", "evm.logs"]
operations = ["query", "discovery"]

[applications.applications.quota]
max_query_range_blocks = 10000
max_requests_per_minute = 120
max_concurrent_requests = 8

[chains.ethereum]
kind = "evm"
chain_id = 1
rpc_urls = ["${DATALENS_ETHEREUM_RPC_URL}"]

[chains.ethereum.finality]
mode = "lag"
safe_lag_blocks = 32
finalized_lag_blocks = 96

[chains.ethereum.datasets.blocks]
enabled = true
max_batch_blocks = 1000

[chains.ethereum.datasets.logs]
enabled = true
max_get_logs_range_blocks = 10000
max_addresses_per_query = 32
