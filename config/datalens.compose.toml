[server]
bind = "0.0.0.0:3000"

[storage]
backend = "s3"

[storage.s3]
bucket = "${DATALENS_S3_BUCKET}"
prefix = "${DATALENS_S3_PREFIX}"
region = "${DATALENS_S3_REGION}"
endpoint_url = "${DATALENS_S3_ENDPOINT_URL}"
force_path_style = true

[storage.parquet]
compression = "zstd"

[planner]
max_query_range_blocks = 100000
default_chunk_range_blocks = 10000

[writer]
target_object_bytes = 16777216
min_object_rows = 1
record_empty_coverage = true

[writer.staging]
enabled = true
min_rows = 1000
target_object_bytes = 16777216
max_staged_ranges = 32
max_staged_rows = 10000
max_staged_age_ms = 60000
flush_on_shutdown = true
max_staged_bytes = 33554432

[metrics]
enabled = true
default_application = "local-compose"

[query.native]
graphql_enabled = true
path = "/native/graphql"
playground_enabled = true
playground_path = "/native/graphiql"

[edge.metrics]
bearer_token = "${DATALENS_METRICS_TOKEN}"

[warmup]
enabled = false
registry_path = ".data/warmup"
scheduler_interval_ms = 1000
max_global_tasks = 1
max_per_chain_tasks = 1
max_fetches_per_loop = 1
flush_on_shutdown = true

[applications]
required = true

[[applications.applications]]
id = "ormp"
name = "ormp"
enabled = true
display_name = "ORMP Local Example"
token = "${DATALENS_ORMP_TOKEN}"
chains = ["ethereum", "arbitrum", "base", "darwinia"]
datasets = ["evm.blocks", "evm.logs"]
operations = ["query", "discovery"]

[applications.applications.quota]
max_query_range_blocks = 10000
max_requests_per_minute = 120
max_concurrent_requests = 8

[[applications.applications]]
id = "live-smoke"
name = "live-smoke"
enabled = true
display_name = "Live Smoke"
token = "${DATALENS_LIVE_SMOKE_TOKEN}"
chains = ["ethereum", "arbitrum", "base", "darwinia", "solana-mainnet-beta", "tron-mainnet"]
datasets = ["evm.blocks", "evm.logs", "solana.slots", "solana.transactions", "solana.instructions", "tron.blocks", "tron.events"]
operations = ["query", "discovery"]

[applications.applications.quota]
max_query_range_blocks = 10000
max_requests_per_minute = 120
max_concurrent_requests = 8

[[applications.applications]]
id = "degov-live"
name = "degov-live"
enabled = true
display_name = "Degov Live Example"
token = "${DATALENS_DEGOV_TOKEN}"
chains = ["ethereum", "arbitrum", "base", "darwinia"]
datasets = ["evm.blocks", "evm.logs"]
operations = ["query", "discovery"]

[applications.applications.quota]
max_query_range_blocks = 10000
max_requests_per_minute = 120
max_concurrent_requests = 8

[chains.ethereum]
kind = "evm"
chain_id = 1
rpc_urls = ["${DATALENS_ETHEREUM_RPC_URL}"]

[chains.ethereum.finality]
mode = "lag"
safe_lag_blocks = 32
finalized_lag_blocks = 96

[chains.ethereum.datasets.blocks]
enabled = true
max_batch_blocks = 1000

[chains.ethereum.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 10000
max_block_scan_range_blocks = 100
max_addresses_per_query = 32

[chains.arbitrum]
kind = "evm"
chain_id = 42161
rpc_urls = ["${DATALENS_ARBITRUM_RPC_URL}"]

[chains.arbitrum.finality]
mode = "lag"
safe_lag_blocks = 64
finalized_lag_blocks = 256

[chains.arbitrum.datasets.blocks]
enabled = true
max_batch_blocks = 1000

[chains.arbitrum.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 10000
max_block_scan_range_blocks = 100
max_addresses_per_query = 32

[chains.base]
kind = "evm"
chain_id = 8453
rpc_urls = ["${DATALENS_BASE_RPC_URL}"]

[chains.base.finality]
mode = "lag"
safe_lag_blocks = 64
finalized_lag_blocks = 256

[chains.base.datasets.blocks]
enabled = true
max_batch_blocks = 1000

[chains.base.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 10000
max_block_scan_range_blocks = 100
max_addresses_per_query = 32

[chains.darwinia]
kind = "evm"
chain_id = 46
rpc_urls = ["${DATALENS_DARWINIA_RPC_URL}"]

[chains.darwinia.finality]
mode = "lag"
safe_lag_blocks = 64
finalized_lag_blocks = 256

[chains.darwinia.datasets.blocks]
enabled = true
max_batch_blocks = 1000

[chains.darwinia.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 10000
max_block_scan_range_blocks = 100
max_addresses_per_query = 32

[chains.solana-mainnet-beta]
kind = "solana"
chain_id = 101
rpc_urls = ["${DATALENS_SOLANA_RPC_URL}"]

[chains.solana-mainnet-beta.finality]
mode = "auto"

[chains.solana-mainnet-beta.datasets.blocks]
enabled = true
max_batch_blocks = 8

[chains.solana-mainnet-beta.datasets.logs]
enabled = false
query_strategy = "provider_filter"
max_get_logs_range_blocks = 1
max_block_scan_range_blocks = 8
max_addresses_per_query = 1

[chains.tron-mainnet]
kind = "tron"
chain_id = 728126428
rpc_urls = ["${DATALENS_TRON_RPC_URL}"]

[chains.tron-mainnet.trongrid]
enabled = true
base_url = "https://api.trongrid.io"
api_key = "${DATALENS_TRONGRID_API_KEY}"

[chains.tron-mainnet.finality]
mode = "auto"

[chains.tron-mainnet.datasets.blocks]
enabled = true
max_batch_blocks = 8

[chains.tron-mainnet.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 8
max_block_scan_range_blocks = 8
max_addresses_per_query = 4
