name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Set git tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: olegtarasov/get-tag@v2.1.4

      - name: Set branch image metadata
        if: github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_TAGS=${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:sha-${SHA},${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:staging" >> "$GITHUB_ENV"

      - name: Set release image metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "IMAGE_TAGS=${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:sha-${SHA},${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:${GIT_TAG_NAME},${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:latest" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
