[workspace]
members = [
  "crates/edge",
  "crates/indexer",
  "crates/chain",
  "crates/testing/chain-conformance",
  "crates/cli",
  "crates/client",
  "crates/core",
  "crates/adapters/evm",
  "crates/runtime/executor",
  "crates/runtime/indexer",
  "crates/metrics",
  "crates/runtime/planner",
  "crates/adapters/solana",
  "crates/storage",
  "crates/adapters/tron",
  "crates/runtime/warmup",
  "crates/runtime/writer",
  "sdks/rust",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
alloy = { version = "2.0.5", default-features = false, features = ["reqwest-rustls-tls", "rpc-client"] }
arrow = "58.3.0"
aws-sdk-s3 = "1.133.0"
axum = "0.8.9"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
clap = { version = "4.6.1", features = ["derive"] }
figment = "0.10.19"
log = "0.4.30"
parquet = "58.3.0"
prometheus = "0.14.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tower = "0.5.2"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
