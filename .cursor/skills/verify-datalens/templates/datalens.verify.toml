[server]
bind = "127.0.0.1:@SERVER_PORT@"
roles = ["api", "worker"]

[database]
url = "@DB_URL@"
max_connections = 8

[query]
max_wait_ms = 20000
page_limit = 10000
follow_attach_blocks = 64

[follow]
subscription_ttl_s = 900
unsafe_retention_s = 86400

[fill]
workers = 2
inline_workers = 1
lease_s = 120
job_retention_s = 86400

[metrics]
bearer_token = "@METRICS_TOKEN@"

[chains.ethereum]
chain_id = 1
rpc_url = "@RPC_URL@"
finality = { mode = "lag", safe_lag_blocks = 32, finalized_lag_blocks = 96 }
tick_ms = 1000
chunk_blocks = 1000
max_get_logs_range_blocks = 1000
max_addresses_per_query = 32
provider = { rps = 5, burst = 8, max_in_flight = 4, min_range_blocks = 16 }

[[applications]]
id = "@APP@"
token = "@TOKEN@"
chains = ["ethereum"]
datasets = ["evm.logs", "evm.blocks"]
quota = { max_range_blocks = 64, max_requests_per_minute = 600, max_concurrent_requests = 4, max_subscriptions = 4 }
admin = true
