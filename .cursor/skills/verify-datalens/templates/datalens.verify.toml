[server]
bind = "127.0.0.1:@SERVER_PORT@"

[storage]
backend = "local"

[storage.local]
root = "@STORAGE_ROOT@"

[storage.parquet]
compression = "zstd"

[planner]
max_query_range_blocks = 1000
default_chunk_range_blocks = 100

[writer]
target_object_bytes = 16777216
min_object_rows = 1
record_empty_coverage = true

[writer.staging]
enabled = false

[metrics]
enabled = true
default_application = "verify"

[query.native]
graphql_enabled = true
path = "/native/graphql"
playground_enabled = false
playground_path = "/native/graphiql"

[edge.metrics]
bearer_token = "@METRICS_TOKEN@"

[warmup]
enabled = false
registry_path = "@STORAGE_ROOT@/warmup"

[applications]
required = true

[[applications.applications]]
id = "@APP@"
name = "@APP@"
enabled = true
display_name = "verify-datalens"
token = "@TOKEN@"
chains = ["ethereum"]
datasets = ["evm.blocks", "evm.logs"]
operations = ["query", "discovery"]

[applications.applications.quota]
max_query_range_blocks = 1000
max_requests_per_minute = 600
max_concurrent_requests = 8

[chains.ethereum]
kind = "evm"
chain_id = 1
rpc_urls = ["@RPC_URL@"]

[chains.ethereum.finality]
mode = "lag"
safe_lag_blocks = 32
finalized_lag_blocks = 96

[chains.ethereum.datasets.blocks]
enabled = true
max_batch_blocks = 100

[chains.ethereum.datasets.logs]
enabled = true
query_strategy = "provider_filter"
max_get_logs_range_blocks = 1000
max_block_scan_range_blocks = 100
max_addresses_per_query = 16
