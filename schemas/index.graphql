type DecodedEvent {
	indexName: String
	chain: String
	chainId: Int
	dataset: String
	blockNumber: Int
	blockHash: String
	transactionHash: String
	transactionIndex: Int
	logIndex: Int
	address: String
	eventName: String
	signature: String
	topic0: String
	decodedArgs: JSON!
	decodeStatus: String
	decodeError: String
	payload: JSON!
	createdAt: String
}

type DecodedEventConnection {
	edges: [DecodedEventEdge!]!
	nodes: [DecodedEvent!]!
	pageInfo: EventPageInfo!
}

type DecodedEventEdge {
	cursor: String!
	node: DecodedEvent!
}

type EventPageInfo {
	endCursor: String
	hasNextPage: Boolean!
}

type IndexedEvent {
	indexName: String
	chain: String
	chainId: Int
	dataset: String
	blockNumber: Int
	blockHash: String
	transactionHash: String
	transactionIndex: Int
	eventIndex: Int
	address: String
	selector: String
	topics: [String!]!
	topic0: String
	signature: String
	eventName: String
	decoded: JSON!
	data: String
	payload: JSON!
	createdAt: String
}

type IndexedEventConnection {
	edges: [IndexedEventEdge!]!
	nodes: [IndexedEvent!]!
	pageInfo: EventPageInfo!
}

type IndexedEventEdge {
	cursor: String!
	node: IndexedEvent!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type QueryRoot {
	"""
	Raw indexed events ordered by blockNumber, transactionIndex, eventIndex, and storage id.
	"""
	events(indexName: String, chain: String, chainId: Int, dataset: String!, address: String, eventName: String, signature: String, fromBlock: Int, toBlock: Int, topic0: String, limit: Int, after: String): [IndexedEvent!]!
	"""
	Cursor-paginated raw indexed events with deterministic event ordering.
	"""
	eventsConnection(indexName: String, chain: String, chainId: Int, dataset: String!, address: String, eventName: String, signature: String, fromBlock: Int, toBlock: Int, topic0: String, first: Int, after: String): IndexedEventConnection!
	"""
	Decoded indexed events ordered by blockNumber, transactionIndex, eventIndex, and storage id.
	"""
	decodedEvents(indexName: String, chain: String, chainId: Int, dataset: String!, address: String, eventName: String, signature: String, fromBlock: Int, toBlock: Int, topic0: String, limit: Int, after: String): [DecodedEvent!]!
	"""
	Cursor-paginated decoded indexed events with deterministic event ordering.
	"""
	decodedEventsConnection(indexName: String, chain: String, chainId: Int, dataset: String!, address: String, eventName: String, signature: String, fromBlock: Int, toBlock: Int, topic0: String, first: Int, after: String): DecodedEventConnection!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
}
