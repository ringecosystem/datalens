[client]
endpoint = "http://127.0.0.1:3000"
application = "ormp"
token_env = "DATALENS_ORMP_TOKEN"

[index]
name = "ormp"
dataset = "evm.logs"
finality = "durable"
chunk_blocks = 1000

# Ethereum mainnet ORMP/Msgport smoke range.
[[sources]]
chain = "ethereum"
family = "evm"
chain_id = 1
from_block = 20009590
to_block = 20059589
addresses = [
  "0x2cd1867fb8016f93710b6386f7f9f1d540a60812",
  "0x13b2211a7ca45db2808f6db05557ce5347e3634e",
]
topics = []

# Polygon PoS ORMP/Msgport smoke range.
[[sources]]
chain = "polygon"
family = "evm"
chain_id = 137
from_block = 64142806
to_block = 64142806
addresses = [
  "0x2cd1867fb8016f93710b6386f7f9f1d540a60812",
  "0x13b2211a7ca45db2808f6db05557ce5347e3634e",
]
topics = []

[decode]
enabled = true

[[decode.events]]
name = "MessageSent"
signature = "MessageSent(bytes32,address,uint256,address,bytes,bytes)"
topic0 = "0x40195d26d027672e04e23e34282d68c3d43ea138415b24c54fcdb9c2573e5975"
contract = "msgport"

[[decode.events.inputs]]
name = "msgId"
kind = "bytes32"
indexed = true

[[decode.events.inputs]]
name = "fromDapp"
kind = "address"

[[decode.events.inputs]]
name = "toChainId"
kind = "uint256"

[[decode.events.inputs]]
name = "toDapp"
kind = "address"

[[decode.events.inputs]]
name = "message"
kind = "bytes"

[[decode.events.inputs]]
name = "params"
kind = "bytes"

[[decode.events]]
name = "MessageAccepted"
signature = "MessageAccepted(bytes32,(address,uint256,uint256,address,uint256,address,uint256,bytes))"
topic0 = "0xd5c2b3449f4d944f0b20a03eef3c6e7bd0ae7e4abef79343f711bbff0a721eb0"
contract = "ormp"

[[decode.events.inputs]]
name = "msgHash"
kind = "bytes32"
indexed = true

[[decode.events.inputs]]
name = "message"
kind = "(address,uint256,uint256,address,uint256,address,uint256,bytes)"

[[decode.events]]
name = "MessageAssigned"
signature = "MessageAssigned(bytes32,address,address,uint256,uint256,bytes)"
topic0 = "0x3832f95736b288316c84b775a004a9d17177362548ce253cba9acb4801875f4d"
contract = "ormp"

[[decode.events.inputs]]
name = "msgHash"
kind = "bytes32"
indexed = true

[[decode.events.inputs]]
name = "oracle"
kind = "address"
indexed = true

[[decode.events.inputs]]
name = "relayer"
kind = "address"
indexed = true

[[decode.events.inputs]]
name = "oracleFee"
kind = "uint256"

[[decode.events.inputs]]
name = "relayerFee"
kind = "uint256"

[[decode.events.inputs]]
name = "params"
kind = "bytes"

[[decode.events]]
name = "MessageDispatched"
signature = "MessageDispatched(bytes32,bool)"
topic0 = "0x62b1dc20fd6f1518626da5b6f9897e8cd4ebadbad071bb66dc96a37c970087a8"
contract = "ormp"

[[decode.events.inputs]]
name = "msgHash"
kind = "bytes32"
indexed = true

[[decode.events.inputs]]
name = "dispatchResult"
kind = "bool"

[output]
kind = "database"

[output.database]
driver = "sqlite"
url = "sqlite:.data/indexes/ormp/index.db"

# PostgreSQL can be used for shared deployments:
# driver = "postgres"
# url = "postgres://datalens:datalens@127.0.0.1:5432/datalens_ormp"

[query]
enabled = true
protocol = "graphql"
bind = "127.0.0.1:9090"
path = "/graphql"
playground = true

[checkpoint]
path = ".data/indexes/ormp/checkpoint.json"
