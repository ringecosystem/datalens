[client]
endpoint = "${DATALENS_INDEX_CLIENT_ENDPOINT}"
application = "ormp"
token_env = "DATALENS_ORMP_TOKEN"

[index]
name = "ormp"
dataset = "evm.logs"
finality = "durable"
chunk_blocks = 1000

[[sources]]
chain = "ethereum"
family = "evm"
chain_id = 1
from_block = 20009590
to_block = 20059589
addresses = [
  "0x2cd1867fb8016f93710b6386f7f9f1d540a60812",
  "0x13b2211a7ca45db2808f6db05557ce5347e3634e",
]
topics = []

[output]
kind = "database"

[output.database]
driver = "postgres"
url = "${DATALENS_INDEX_DATABASE_URL}"

[query]
enabled = true
protocol = "graphql"
bind = "${DATALENS_INDEX_QUERY_BIND}"
path = "/graphql"
playground = true

[query.metrics]
enabled = true
path = "/metrics"
token_env = "DATALENS_INDEX_QUERY_METRICS_TOKEN"

[checkpoint]
path = "indexes/ormp/checkpoint.json"
