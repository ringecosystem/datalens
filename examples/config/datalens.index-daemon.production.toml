[client]
endpoint = "${DATALENS_INDEX_CLIENT_ENDPOINT}"
application = "public"
token_env = "DATALENS_INDEX_APPLICATION_TOKEN"

[index]
name = "public-evm-logs"
dataset = "evm.logs"
finality = "durable"
chunk_blocks = 1000

[[sources]]
chain = "ethereum"
family = "evm"
chain_id = 1
from_block = 0
addresses = []
topics = []

[decode]
enabled = false
events = []

[output]
kind = "database"

[output.database]
driver = "postgres"
url = "${DATALENS_INDEX_DATABASE_URL}"

[query]
enabled = true
protocol = "graphql"
bind = "${DATALENS_INDEX_QUERY_BIND}"
path = "/graphql"
playground = false

[query.metrics]
enabled = true
path = "/metrics"
token_env = "DATALENS_INDEX_QUERY_METRICS_TOKEN"

[checkpoint]
path = "/var/lib/datalens/indexes/public-evm-logs/checkpoint.json"
